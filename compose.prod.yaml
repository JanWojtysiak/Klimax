services:
  klimax:
    build: .
    image: klimax
    container_name: klimax
    restart: unless-stopped
    expose:
      - "3000"
    env_file:
      - path: .env
        required: false
    volumes:
      - uploads:/app/uploads

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: klimax-cloudflared
    restart: unless-stopped
    depends_on:
      - klimax
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?Ustaw TUNNEL_TOKEN w .env}

volumes:
  uploads:
