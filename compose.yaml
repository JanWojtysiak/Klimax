services:
  klimax:
    build:
      context: .
      target: deps
    container_name: klimax-dev
    command: npx next dev --webpack
    environment:
      WATCHPACK_POLLING: "true"
      HOSTNAME: 0.0.0.0
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
